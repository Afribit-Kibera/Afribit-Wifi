port: 3000
host: 0.0.0.0
database:
  path: data/sqlite.db
storage:
  backend: local
  local:
    dir: ./data/blobs
  removeWhenNoOwners: false
  rules:
    - type: "*"
      expiration: 1 year
upload:
  enabled: true
  requireAuth: true
  maxSize: 10485760
  workers: 1
  maxJobsPerWorker: 2
mirror:
  enabled: false
  requireAuth: true
delete:
  requireAuth: true
list:
  enabled: true
  requireAuth: true
  allowListOthers: false
media:
  enabled: false
landing:
  enabled: true
  title: Kibera Mesh Blossom Storage
report:
  enabled: true
