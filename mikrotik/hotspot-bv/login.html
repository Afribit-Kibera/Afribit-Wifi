<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3 West Satenet WiFi</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a0a;color:#f5f5ef;font:16px Arial,sans-serif;text-align:center;padding:24px}main{max-width:360px}button{min-height:48px;border:0;border-radius:8px;background:#f7931a;color:#090a0a;font-weight:700;padding:0 24px}p{color:#a3aaa5;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <h1>3 West Satenet WiFi</h1>
    <p>Opening secure access...</p>
    <form id="portal" action="https://wifi.afribit.africa/" method="get">
      <input type="hidden" name="mac" value="$(mac)">
      <input type="hidden" name="ip" value="$(ip)">
      <input type="hidden" name="router" value="bitcoin-valley-main">
      <input type="hidden" name="link-login" value="$(link-login)">
      <input type="hidden" name="link-orig" value="$(link-orig)">
      <button type="submit">Continue</button>
    </form>
  </main>
  <script>document.getElementById("portal").submit()</script>
</body>
</html>
